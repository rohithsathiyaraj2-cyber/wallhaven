
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallHaven | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b0714;color:white}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;padding:22px 8%;background:#120b20;border-bottom:1px solid #332044}
.logo{font-size:27px;font-weight:bold;color:#c084fc}
header a,footer a{color:white;text-decoration:none}
header nav{display:flex;gap:18px;flex-wrap:wrap}
.admin-page{max-width:900px;margin:42px auto;padding:0 20px 60px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.admin-top a{color:#c084fc;text-decoration:none;font-weight:800}
.panel{background:#171022;border:1px solid #7040a0;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 0 25px rgba(147,51,234,.10)}
.panel h2,.panel h3{color:#d8b4fe;margin-bottom:10px}
.panel form{display:flex;flex-direction:column;gap:13px;margin-top:18px}
.panel input,.panel textarea,.panel select{
width:100%;padding:12px;border:1px solid #49305f;border-radius:8px;
background:#0d0914;color:white;font-size:14px
}
.panel select{cursor:pointer}
.panel input:focus,.panel textarea:focus,.panel select:focus{
outline:none;border-color:#c084fc;box-shadow:0 0 10px #9333ea44
}
.panel textarea{min-height:85px;resize:vertical}
.admin-button{border:0;border-radius:8px;padding:12px 16px;background:linear-gradient(110deg,#7e22ce,#a855f7);color:white;font-weight:700;cursor:pointer;transition:.2s}
.admin-button:hover{transform:translateY(-2px);box-shadow:0 0 15px #9333ea88}
.admin-button:disabled{opacity:.6;cursor:wait;transform:none}
.admin-wallpaper-list{display:grid;gap:12px;margin-top:16px}
.admin-wallpaper-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:#0d0914;border:1px solid #49305f;border-radius:10px;flex-wrap:wrap}
.admin-wallpaper-item span{overflow-wrap:anywhere;flex:1}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.delete-wallpaper{border:1px solid #ef4444;background:#7f1d1d;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}
.edit-wallpaper{border:1px solid #a855f7;background:#3b1760;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}
#admin-message,#upload-message,#manage-message,#edit-message{margin-top:12px;overflow-wrap:anywhere;color:#d8b4fe}
#admin-dashboard,#edit-panel{display:none}
.custom-category{display:none}
.field-label{color:#c4b5d3;font-size:13px;margin-bottom:-7px}
footer{text-align:center;padding:25px 15px;color:#e9d5ff;background:#171022;border-top:1px solid #a855f7;margin-top:40px}
footer h3{color:#c084fc;margin-bottom:15px}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}
footer p{font-size:13px;margin-top:18px}
@media(max-width:600px){
.admin-page{margin:24px auto;padding:0 14px 40px}
.panel{padding:17px}
}
</style>
</head>

<body>
<header>
  <div class="logo">WallHaven.</div>
  <nav><a href="index.html">Explore Wallpapers</a></nav>
</header>

<main class="admin-page">
  <div class="admin-top">
    <div>
      <h1 style="color:#e9d5ff">Admin Dashboard</h1>
      <p style="color:#b9adc9;margin-top:8px">Manage your wallpaper store</p>
    </div>
    <a href="index.html">← Back to store</a>
  </div>

  <section class="panel" id="login-panel">
    <h2>Admin Login</h2>
    <p style="color:#b9adc9">Login to upload, edit and manage wallpapers.</p>
    <form id="admin-login-form">
      <input type="email" id="admin-email" placeholder="Admin email" required>
      <input type="password" id="admin-password" placeholder="Password" required>
      <button type="submit" class="admin-button">Login</button>
    </form>
    <p id="admin-message" role="status"></p>
  </section>

  <section id="admin-dashboard">
    <section class="panel">
      <h2>Upload New Wallpaper</h2>

      <form id="upload-form">
        <input type="text" id="wallpaper-title" placeholder="Wallpaper title" required>
        <textarea id="wallpaper-description" placeholder="Wallpaper description"></textarea>

        <label class="field-label" for="wallpaper-category">Select Category</label>
        <select id="wallpaper-category" required>
          <option value="">Select a category</option>
          <option value="__new__">+ Add New Category</option>
        </select>
        <input type="text" id="wallpaper-new-category" class="custom-category" placeholder="Enter new category">

        <label class="field-label" for="wallpaper-price">Price in ₹ (Enter 0 for free)</label>
        <input type="number" id="wallpaper-price" placeholder="Price in ₹" min="0" step="0.01" required>

        <input type="file" id="wallpaper-file" accept="image/*" required>
        <button type="submit" class="admin-button">Upload Wallpaper</button>
      </form>

      <p id="upload-message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Manage Wallpapers</h2>
      <p style="color:#b9adc9">Edit details or remove an existing wallpaper.</p>
      <div id="admin-wallpaper-list" class="admin-wallpaper-list">
        <p>Loading wallpapers...</p>
      </div>
      <p id="manage-message" role="status"></p>
    </section>

    <section class="panel" id="edit-panel">
      <h2>Edit Wallpaper</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-wallpaper-id">
        <input type="text" id="edit-title" placeholder="Wallpaper title" required>
        <textarea id="edit-description" placeholder="Wallpaper description"></textarea>

        <label class="field-label" for="edit-category">Select Category</label>
        <select id="edit-category" required>
          <option value="">Select a category</option>
          <option value="__new__">+ Add New Category</option>
        </select>
        <input type="text" id="edit-new-category" class="custom-category" placeholder="Enter new category">

        <label class="field-label" for="edit-price">Price in ₹ (Enter 0 for free)</label>
        <input type="number" id="edit-price" placeholder="Price in ₹" min="0" step="0.01" required>

        <label class="field-label">Replace image (optional)</label>
        <input type="file" id="edit-file" accept="image/*">

        <button type="submit" class="admin-button">Save Changes</button>
        <button type="button" class="edit-wallpaper" id="cancel-edit">Cancel</button>
      </form>
      <p id="edit-message" role="status"></p>
    </section>
  </section>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://vxtryneiljxvrnakubdd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p1qEiO-agXUY6iyxH8OJnQ_rU0gg7Yp";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const byId = id => document.getElementById(id);

let knownCategories = [];

function updateCategoryOptions() {
  ["wallpaper-category", "edit-category"].forEach(id => {
    const select = byId(id);
    const previousValue = select.value;

    select.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select a category";
    select.appendChild(placeholder);

    knownCategories.forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });

    const custom = document.createElement("option");
    custom.value = "__new__";
    custom.textContent = "+ Add New Category";
    select.appendChild(custom);

    if (previousValue && previousValue !== "__new__" &&
        knownCategories.includes(previousValue)) {
      select.value = previousValue;
    }
  });
}

function toggleCustomCategory(selectId, inputId) {
  const select = byId(selectId);
  const input = byId(inputId);
  const isCustom = select.value === "__new__";

  input.style.display = isCustom ? "block" : "none";
  input.required = isCustom;

  if (!isCustom) input.value = "";
}

function getCategory(selectId, inputId) {
  const selected = byId(selectId).value;

  if (selected === "__new__") {
    return byId(inputId).value.trim();
  }

  return selected.trim();
}

function setCategoryForEdit(category) {
  const select = byId("edit-category");
  const customInput = byId("edit-new-category");

  if (knownCategories.includes(category)) {
    select.value = category;
    customInput.value = "";
    customInput.style.display = "none";
    customInput.required = false;
  } else {
    select.value = "__new__";
    customInput.value = category || "";
    customInput.style.display = "block";
    customInput.required = true;
  }
}

byId("wallpaper-category").addEventListener("change", () => {
  toggleCustomCategory("wallpaper-category", "wallpaper-new-category");
});

byId("edit-category").addEventListener("change", () => {
  toggleCustomCategory("edit-category", "edit-new-category");
});

async function refreshAdminWallpapers() {
  const list = byId("admin-wallpaper-list");
  const message = byId("manage-message");

  list.innerHTML = "<p>Loading wallpapers...</p>";
  message.textContent = "";

  try {
    const {data: sessionData, error: sessionError} =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;
    if (!sessionData.session) throw new Error("Please log in again.");

    const {data, error} = await supabaseClient
      .from("wallpapers")
      .select("id,title,description,category,price_paise,storage_path,preview_url,is_published")
      .order("created_at", {ascending:false});

    if (error) throw error;

    knownCategories = [
      ...new Set(
        (data || [])
          .map(item => String(item.category || "").trim())
          .filter(Boolean)
      )
    ].sort((a,b) => a.localeCompare(b));

    updateCategoryOptions();

    list.innerHTML = "";

    if (!data || !data.length) {
      list.innerHTML = "<p>No wallpapers found.</p>";
      return;
    }

    data.forEach(wallpaper => {
      const item = document.createElement("div");
      item.className = "admin-wallpaper-item";

      const label = document.createElement("span");
      const priceText = Number(wallpaper.price_paise) === 0
        ? "FREE"
        : "₹" + (Number(wallpaper.price_paise) / 100).toFixed(2);

      label.textContent =
        (wallpaper.title || "Untitled wallpaper") +
        " — " + (wallpaper.category || "Uncategorized") +
        " — " + priceText +
        (wallpaper.is_published ? " — Published" : " — Draft");

      const actions = document.createElement("div");
      actions.className = "admin-actions";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "edit-wallpaper";
      edit.textContent = "Edit";

      edit.addEventListener("click", () => {
        byId("edit-wallpaper-id").value = wallpaper.id;
        byId("edit-title").value = wallpaper.title || "";
        byId("edit-description").value = wallpaper.description || "";

        setCategoryForEdit(wallpaper.category || "");

        byId("edit-price").value =
          (Number(wallpaper.price_paise) / 100).toFixed(2);

        byId("edit-file").value = "";
        byId("edit-message").textContent = "";
        byId("edit-panel").style.display = "block";
        byId("edit-panel").scrollIntoView({
          behavior:"smooth",
          block:"start"
        });
      });

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete-wallpaper";
      del.textContent = "Delete";

      del.addEventListener("click", async () => {
        if (!confirm("Delete this wallpaper? This cannot be undone.")) return;

        del.disabled = true;
        del.textContent = "Deleting...";

        try {
          if (wallpaper.storage_path) {
            const {error} = await supabaseClient.storage
              .from("wallpaper-files")
              .remove([wallpaper.storage_path]);

            if (error) throw error;
          }

          if (wallpaper.preview_url) {
            const u = new URL(wallpaper.preview_url);
            const marker =
              "/storage/v1/object/public/wallpaper-previews/";
            const idx = u.pathname.indexOf(marker);

            if (idx >= 0) {
              const path = decodeURIComponent(
                u.pathname.slice(idx + marker.length)
              );

              if (path) {
                const {error} = await supabaseClient.storage
                  .from("wallpaper-previews")
                  .remove([path]);

                if (error) throw error;
              }
            }
          }

          const {error} = await supabaseClient
            .from("wallpapers")
            .delete()
            .eq("id", wallpaper.id);

          if (error) throw error;

          message.textContent = "Wallpaper deleted.";
          await refreshAdminWallpapers();

        } catch (err) {
          console.error(err);
          message.textContent = "Delete failed: " + err.message;
          del.disabled = false;
          del.textContent = "Delete";
        }
      });

      actions.append(edit, del);
      item.append(label, actions);
      list.append(item);
    });

  } catch (err) {
    console.error(err);
    list.innerHTML = "<p>Could not load wallpapers.</p>";
    message.textContent = "Manage error: " + err.message;
  }
}

byId("admin-login-form").addEventListener("submit", async function(event) {
  event.preventDefault();

  const msg = byId("admin-message");
  const button = this.querySelector('button[type="submit"]');

  msg.textContent = "Logging in...";
  button.disabled = true;

  try {
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email:byId("admin-email").value.trim(),
      password:byId("admin-password").value
    });

    if (error) throw error;
    if (!data.session) throw new Error("No login session was created.");

    msg.textContent = "Login successful.";
    byId("login-panel").style.display = "none";
    byId("admin-dashboard").style.display = "block";

    await refreshAdminWallpapers();

  } catch(err) {
    console.error(err);
    msg.textContent = "Login failed: " + err.message;
  } finally {
    button.disabled = false;
  }
});

byId("upload-form").addEventListener("submit", async function(event) {
  event.preventDefault();

  const form = this;
  const msg = byId("upload-message");
  const button = form.querySelector('button[type="submit"]');

  const title = byId("wallpaper-title").value.trim();
  const description = byId("wallpaper-description").value.trim();
  const category = getCategory(
    "wallpaper-category",
    "wallpaper-new-category"
  );
  const price = Number(byId("wallpaper-price").value);
  const file = byId("wallpaper-file").files[0];

  if (
    !file || !title || !category ||
    !Number.isFinite(price) || price < 0 ||
    byId("wallpaper-price").value.trim() === ""
  ) {
    msg.textContent = "Enter title, category, valid price and select an image.";
    return;
  }

  if (!file.type.startsWith("image/") || file.size > 15*1024*1024) {
    msg.textContent = "Choose an image smaller than 15 MB.";
    return;
  }

  const {data:sd,error:se} = await supabaseClient.auth.getSession();

  if (se || !sd.session) {
    msg.textContent = "Please log in before uploading.";
    return;
  }

  let originalPath = null;
  let previewPath = null;
  let originalUploaded = false;
  let previewUploaded = false;
  let saved = false;
  let objectUrl = null;

  button.disabled = true;

  try {
    msg.textContent = "Preparing preview...";

    const image = new Image();
    objectUrl = URL.createObjectURL(file);

    await new Promise((resolve,reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("Could not read image."));
      image.src = objectUrl;
    });

    const scale = Math.min(
      1,
      1200 / Math.max(image.naturalWidth,image.naturalHeight)
    );

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
    canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));

    canvas.getContext("2d").drawImage(
      image,0,0,canvas.width,canvas.height
    );

    const blob = await new Promise((resolve,reject) =>
      canvas.toBlob(
        b => b ? resolve(b) : reject(new Error("Could not create preview.")),
        "image/jpeg",
        0.7
      )
    );

    const id = crypto.randomUUID();
    const ext = (file.name.split(".").pop() || "").toLowerCase();

    originalPath = id + "." +
      (/^[a-z0-9]{1,10}$/.test(ext) ? ext : "bin");

    previewPath = id + ".jpg";

    msg.textContent = "Uploading original...";

    let result = await supabaseClient.storage
      .from("wallpaper-files")
      .upload(originalPath,file,{
        contentType:file.type,
        upsert:false
      });

    if (result.error) throw result.error;
    originalUploaded = true;

    msg.textContent = "Uploading preview...";

    result = await supabaseClient.storage
      .from("wallpaper-previews")
      .upload(previewPath,blob,{
        contentType:"image/jpeg",
        upsert:false
      });

    if (result.error) throw result.error;
    previewUploaded = true;

    const {data:pd} = supabaseClient.storage
      .from("wallpaper-previews")
      .getPublicUrl(previewPath);

    msg.textContent = "Saving wallpaper...";

    result = await supabaseClient.from("wallpapers").insert({
      title,
      description,
      category,
      price_paise:Math.round(price*100),
      storage_path:originalPath,
      preview_url:pd.publicUrl,
      is_published:true
    });

    if (result.error) throw result.error;

    saved = true;
    form.reset();

    toggleCustomCategory(
      "wallpaper-category",
      "wallpaper-new-category"
    );

    msg.textContent = price === 0
      ? "Free wallpaper published successfully!"
      : "Wallpaper published successfully.";

    await refreshAdminWallpapers();

  } catch(err) {
    console.error(err);
    msg.textContent = "Upload failed: " + err.message;

    if (!saved && originalUploaded) {
      await supabaseClient.storage
        .from("wallpaper-files").remove([originalPath]);
    }

    if (!saved && previewUploaded) {
      await supabaseClient.storage
        .from("wallpaper-previews").remove([previewPath]);
    }

  } finally {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    button.disabled = false;
  }
});

byId("edit-form").addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = this.querySelector('button[type="submit"]');
  const msg = byId("edit-message");

  const id = byId("edit-wallpaper-id").value;
  const title = byId("edit-title").value.trim();
  const description = byId("edit-description").value.trim();
  const category = getCategory("edit-category","edit-new-category");
  const price = Number(byId("edit-price").value);
  const file = byId("edit-file").files[0];

  if (
    !id || !title || !category ||
    !Number.isFinite(price) || price < 0 ||
    byId("edit-price").value.trim() === ""
  ) {
    msg.textContent = "Check the required fields and price.";
    return;
  }

  button.disabled = true;
  msg.textContent = "Saving changes...";

  let newOriginal = null;
  let newPreview = null;
  let originalUploaded = false;
  let previewUploaded = false;
  let objectUrl = null;
  let updateSaved = false;

  try {
    const patch = {
      title,
      description,
      category,
      price_paise:Math.round(price*100)
    };

    if (file) {
      if (!file.type.startsWith("image/") || file.size > 15*1024*1024) {
        throw new Error("Choose an image smaller than 15 MB.");
      }

      const {data:rows,error:fetchError} = await supabaseClient
        .from("wallpapers")
        .select("storage_path,preview_url")
        .eq("id",id)
        .single();

      if (fetchError) throw fetchError;

      const image = new Image();
      objectUrl = URL.createObjectURL(file);

      await new Promise((resolve,reject) => {
        image.onload = resolve;
        image.onerror = () =>
          reject(new Error("Could not read replacement image."));
        image.src = objectUrl;
      });

      const scale = Math.min(
        1,
        1200 / Math.max(image.naturalWidth,image.naturalHeight)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));

      canvas.getContext("2d").drawImage(
        image,0,0,canvas.width,canvas.height
      );

      const blob = await new Promise((resolve,reject) =>
        canvas.toBlob(
          b => b ? resolve(b) : reject(new Error("Could not create preview.")),
          "image/jpeg",
          0.7
        )
      );

      const newId = crypto.randomUUID();
      const ext = (file.name.split(".").pop() || "").toLowerCase();

      newOriginal = newId + "." +
        (/^[a-z0-9]{1,10}$/.test(ext) ? ext : "bin");

      newPreview = newId + ".jpg";

      let r = await supabaseClient.storage
        .from("wallpaper-files")
        .upload(newOriginal,file,{
          contentType:file.type,
          upsert:false
        });

      if (r.error) throw r.error;
      originalUploaded = true;

      r = await supabaseClient.storage
        .from("wallpaper-previews")
        .upload(newPreview,blob,{
          contentType:"image/jpeg",
          upsert:false
        });

      if (r.error) throw r.error;
      previewUploaded = true;

      const {data:publicData} = supabaseClient.storage
        .from("wallpaper-previews")
        .getPublicUrl(newPreview);

      patch.storage_path = newOriginal;
      patch.preview_url = publicData.publicUrl;

      const {error:updateError} = await supabaseClient
        .from("wallpapers")
        .update(patch)
        .eq("id",id);

      if (updateError) throw updateError;
      updateSaved = true;

      if (rows.storage_path) {
        const {error} = await supabaseClient.storage
          .from("wallpaper-files")
          .remove([rows.storage_path]);

        if (error) console.error("Old original cleanup failed:",error);
      }

      if (rows.preview_url) {
        const u = new URL(rows.preview_url);
        const marker =
          "/storage/v1/object/public/wallpaper-previews/";
        const ix = u.pathname.indexOf(marker);

        if (ix >= 0) {
          const p = decodeURIComponent(
            u.pathname.slice(ix+marker.length)
          );

          if (p) {
            const {error} = await supabaseClient.storage
              .from("wallpaper-previews")
              .remove([p]);

            if (error) console.error("Old preview cleanup failed:",error);
          }
        }
      }

    } else {
      const {error} = await supabaseClient
        .from("wallpapers")
        .update(patch)
        .eq("id",id);

      if (error) throw error;
      updateSaved = true;
    }

    msg.textContent = price === 0
      ? "Wallpaper updated as FREE successfully."
      : "Wallpaper updated successfully.";

    byId("edit-panel").style.display = "none";
    this.reset();

    await refreshAdminWallpapers();

  } catch(err) {
    console.error(err);
    msg.textContent = "Update failed: " + err.message;

    if (!updateSaved && originalUploaded && newOriginal) {
      await supabaseClient.storage
        .from("wallpaper-files").remove([newOriginal]);
    }

    if (!updateSaved && previewUploaded && newPreview) {
      await supabaseClient.storage
        .from("wallpaper-previews").remove([newPreview]);
    }

  } finally {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    button.disabled = false;
  }
});

byId("cancel-edit").addEventListener("click",() => {
  byId("edit-panel").style.display = "none";
  byId("edit-form").reset();

  toggleCustomCategory("edit-category","edit-new-category");
});

</script>
</body>
</html>
