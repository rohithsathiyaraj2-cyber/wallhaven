        footer {

        /* MODALS */

        .modal {

            inset: 0;

<body>

<div class="container">

    <div class="tagline">ENTER YOUR IMAGINATION</div>

    <h1>Welcome to a World<br>Beyond Imagination</h1>

        Give your screen a new identity.

        <button class="btn" onclick="openAuth('login')">LOGIN</button>

<!-- AUTHENTICATION MODAL -->

<div class="modal" id="authModal">

    <div class="modal-box">

        <span class="close" onclick="closeAuth()">×</span>

        <h2 id="authTitle">LOGIN</h2>

        <form id="authForm">

            <input type="text" id="fullName"
                   placeholder="Full Name"
                   autocomplete="name" hidden>

            <input type="email" id="email"
                   placeholder="Email address"
                   autocomplete="email" required>

            <input type="password" id="password"
                   placeholder="Password"
                   minlength="6"
                   autocomplete="current-password" required>

            <input type="password" id="confirmPassword"
                   placeholder="Confirm Password"
                   minlength="6"
                   autocomplete="new-password" hidden>

            <button type="submit" class="btn" id="authSubmit">
                LOGIN
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

    </div>

</div>

<!-- SUCCESS POPUP -->

<div class="modal" id="successModal">

    <div class="modal-box">

        <div class="success-icon">✦</div>

        <h2 class="success-title" id="successTitle">
            WELCOME TO WALLHAVEN
        </h2>

        <p class="success-text" id="successText">
            Your journey into a world of extraordinary wallpapers starts here.
        </p>

        <a href="explore.html" class="btn explore-btn">
            EXPLORE WALLPAPERS →
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://vxtryneiljxvrnakubdd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_p1qEiO-agXUY6iyxH8OJnQ_rU0gg7Yp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let authMode = "login";

function openAuth(mode) {

    authMode = mode;

    const form = document.getElementById("authForm");

    form.reset();

    document.getElementById("authTitle").textContent =
        mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

    document.getElementById("authSubmit").textContent =
        mode === "login" ? "LOGIN" : "SIGN UP";

    document.getElementById("fullName").hidden =
        mode === "login";

    document.getElementById("confirmPassword").hidden =
        mode === "login";

    document.getElementById("fullName").required =
        mode === "signup";

    document.getElementById("confirmPassword").required =
        mode === "signup";

    document.getElementById("password").placeholder =
        mode === "login" ? "Password" : "Create Password";

    document.getElementById("password").autocomplete =
        mode === "login" ? "current-password" : "new-password";

    document.getElementById("message").textContent = "";

    document.getElementById("authModal").style.display = "flex";

}

function closeAuth() {

    document.getElementById("authModal").style.display = "none";

}

function showSuccess(mode) {

    document.getElementById("authModal").style.display = "none";

    document.getElementById("successTitle").textContent =
        mode === "signup"
        ? "ACCOUNT CREATED!"
        : "WELCOME BACK!";

    document.getElementById("successText").textContent =
        mode === "signup"
        ? "Your WallHaven account is ready. Enjoy exploring!"
        : "Login successful! Welcome back to WallHaven.";

    document.getElementById("successModal").style.display = "flex";

}

// SIGNUP AND LOGIN

document.getElementById("authForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const submitButton =
            document.getElementById("authSubmit");

        if (authMode === "signup") {

            if (!fullName) {
                message.textContent = "Please enter your full name.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

        }

        message.textContent = "Please wait...";

        submitButton.disabled = true;
        submitButton.textContent = "PLEASE WAIT...";

        try {

            let result;

            if (authMode === "signup") {

                result = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: fullName
                        }
                    }

                });

            } else {

                result = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });

            }

            if (result.error) {

                message.textContent = result.error.message;
                return;

            }

            if (!result.data.session) {

                message.textContent =
                    "Account created! Please check your email and confirm your account before logging in.";

                return;

            }

            showSuccess(authMode);

        }

        catch (error) {

            message.textContent =
                error.message || "Something went wrong. Please try again.";

        }

        finally {

            submitButton.disabled = false;

            submitButton.textContent =
                authMode === "login" ? "LOGIN" : "SIGN UP";

        }

    }
);

// CLOSE MODALS

document.getElementById("authModal").addEventListener(
    "click",
    function(e) {

        if (e.target === this) {
            closeAuth();
        }

    }
);

document.getElementById("successModal").addEventListener(
    "click",
    function(e) {

        if (e.target === this) {
            this.style.display = "none";
        }

    }
);

</script>

</body>
