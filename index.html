
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | WallHaven</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at 50% 45%, rgba(119, 36, 210, 0.28), transparent 55%),
        linear-gradient(135deg, #08040f, #160626, #090410);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(180,100,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,100,255,.035) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

.container {
    width: 100%;
    max-width: 900px;
    padding: 40px 22px;
    position: relative;
    z-index: 1;
}

.tagline {
    color: #c59aff;
    letter-spacing: 5px;
    font-size: 12px;
    margin-bottom: 25px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(38px, 7vw, 76px);
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, #ffffff, #c58aff, #8e43ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 35px rgba(155, 75, 255, .15);
}

.subtitle {
    color: #b9a9ca;
    font-size: 16px;
    margin: 22px auto 38px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
}

.btn {
    padding: 15px 34px;
    border-radius: 9px;
    border: 1px solid #a45aff;
    color: white;
    background: rgba(126, 48, 220, .13);
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    background: #8d3df5;
    box-shadow: 0 0 25px rgba(155, 75, 255, .55);
    transform: translateY(-3px);
}

.explore {
    display: inline-block;
    margin-top: 23px;
    padding: 16px 42px;
    background: linear-gradient(100deg, #7628d8, #ad55ff);
    border: none;
    box-shadow: 0 0 25px rgba(150, 65, 255, .25);
}

footer {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;
    color: #9684aa;
    font-size: 13px;
    letter-spacing: 1px;
}

footer a {
    color: #c58aff;
    text-decoration: none;
    font-weight: 700;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.modal-box {
    width: 100%;
    max-width: 390px;
    padding: 35px 25px;
    background: #170d25;
    border: 1px solid #8e43d8;
    border-radius: 16px;
    box-shadow: 0 0 35px rgba(135, 55, 220, .3);
}

.modal-box h2 {
    color: #d2aaff;
    margin-bottom: 22px;
}

.modal-box input {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    background: #0d0715;
    color: white;
    border: 1px solid #58327b;
    border-radius: 7px;
    outline: none;
}

.modal-box .btn {
    width: 100%;
    margin-top: 15px;
}

.close {
    float: right;
    cursor: pointer;
    color: #c59aff;
    font-size: 22px;
}

#message {
    margin-top: 15px;
    color: #c59aff;
    font-size: 13px;
}

@media(max-width: 500px) {
    .buttons {
        flex-direction: column;
        padding: 0 15px;
    }

    .btn {
        width: 100%;
    }

    footer {
        position: relative;
        margin-top: 65px;
        bottom: auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="tagline">ENTER YOUR IMAGINATION</div>

    <h1>Welcome to a World<br>Beyond Imagination</h1>

    <p class="subtitle">
        Discover extraordinary wallpapers.<br>
        Give your screen a new identity.
    </p>

    <div class="buttons">
        <button class="btn" onclick="openAuth('login')">LOGIN</button>
        <button class="btn" onclick="openAuth('signup')">SIGN UP</button>
    </div>

    <a href="explore.html" class="btn explore">
        EXPLORE WALLPAPERS →
    </a>

</div>

<footer>
    FOLLOW US &nbsp;·&nbsp;
    <a href="https://www.instagram.com/rohxthx.__/"
       target="_blank" rel="noopener noreferrer">
       @rohxthx.__
    </a>
</footer>

<div class="modal" id="authModal">
    <div class="modal-box">
        <span class="close" onclick="closeAuth()">×</span>
        <h2 id="authTitle">LOGIN</h2>

        <form id="authForm">
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" minlength="6" required>
            <button type="submit" class="btn" id="authSubmit">LOGIN</button>
        </form>

        <p id="message"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://vxtryneiljxvrnakubdd.supabase.co";
const SUPABASE_KEY = "sb_publishable_p1qEiO-agXUY6iyxH8OJnQ_rU0gg7Yp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let authMode = "login";

function openAuth(mode) {
    authMode = mode;
    document.getElementById("authTitle").textContent =
        mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

    document.getElementById("authSubmit").textContent =
        mode === "login" ? "LOGIN" : "SIGN UP";

    document.getElementById("message").textContent = "";
    document.getElementById("authModal").style.display = "flex";
}

function closeAuth() {
    document.getElementById("authModal").style.display = "none";
}

document.getElementById("authForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Please wait...";

    try {
        let result;

        if (authMode === "signup") {
            result = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (!result.error) {
                message.textContent =
                    "Account created! Check your email if verification is required.";
            }
        } else {
            result = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (!result.error) {
                message.textContent = "Login successful!";
            }
        }

        if (result.error) {
            message.textContent = result.error.message;
        }

    } catch (error) {
        message.textContent = "Something went wrong. Please try again.";
    }
});

document.getElementById("authModal").addEventListener("click", function(e) {
    if (e.target === this) closeAuth();
});
</script>

</body>
</html>
