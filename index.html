
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallHaven | Premium Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b0714;color:white}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;padding:22px 8%;background:#120b20;border-bottom:1px solid #332044}
.logo{font-size:27px;font-weight:bold;color:#c084fc}
header a,footer a{color:white;text-decoration:none}
header nav{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
header nav a{font-family:Arial,sans-serif;font-weight:800;letter-spacing:.4px;color:#c084fc;text-shadow:0 0 10px rgba(168,85,247,.35);transition:.2s}
header nav a:hover{color:#fff;text-shadow:0 0 14px #a855f7}
.hero{text-align:center;padding:75px 20px 45px}
.hero h1{font-size:clamp(32px,6vw,55px);margin-bottom:16px}
.hero span{color:#c084fc}
.hero p{color:#b9adc9;line-height:1.7}
.search{margin-top:25px;padding:14px;width:min(90%,420px);border:1px solid #65428b;border-radius:10px;background:#1a1028;color:white;font-size:16px}
.gallery{padding:25px 8% 70px}
.gallery h2{margin-bottom:25px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:#171022;border:1px solid #30203f;border-radius:15px;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-5px);border-color:#a855f7}
.preview{height:230px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#38145c,#111827,#7028a8);color:#ead5ff;font-size:24px;font-weight:bold}
.preview img{width:100%;height:100%;object-fit:cover}
.details{padding:18px}
.details p{color:#b9adc9;margin:10px 0 16px;font-size:14px;line-height:1.5}
.buy{display:block;width:100%;border:none;border-radius:8px;padding:12px;background:#9333ea;color:white;font-size:15px;cursor:pointer}
.buy:hover{background:#a855f7}
.buy:disabled{opacity:.6;cursor:wait}
footer{text-align:center;padding:25px 15px;color:#e9d5ff;background:#171022;border-top:1px solid #a855f7;margin-top:40px}
footer h3{color:#c084fc;margin-bottom:15px}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}
footer p{font-size:13px;margin-top:18px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){header{padding:18px 5%}.gallery{padding-left:5%;padding-right:5%}header nav{gap:14px}.cards{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
    <div class="logo">WallHaven.</div>
    <nav>
        <a href="#gallery">Explore Wallpapers</a>
        <a class="nav-link" href="admin.html">Admin Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Your Screen, <span>Your Style.</span></h1>
    <p>Discover premium wallpapers for your PC and mobile.</p>
    <input class="search" id="search" type="text" placeholder="Search wallpapers...">
</section>

<section class="gallery" id="gallery">
    <h2>Explore Wallpapers</h2>
    <div class="cards" id="cards"><p>Loading wallpapers...</p></div>
</section>
<footer>
    <h3>WallHaven</h3>
    <nav>
        <a href="terms.html">Terms &amp; Conditions</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="refund.html">Refund &amp; Cancellation</a>
        <a href="shipping.html">Shipping Policy</a>
        <a href="contact.html">Contact Us</a>
    </nav>
    <p>© WallHaven. All rights reserved.</p>
</footer>

<script>
"use strict";

const API_BASE = "https://wallhaven.onrender.com";
const SUPABASE_URL = "https://vxtryneiljxvrnakubdd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p1qEiO-agXUY6iyxH8OJnQ_rU0gg7Yp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const cardsContainer = document.getElementById("cards");

async function readJson(response) {
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.error || "Request failed. Please try again.");
    }

    return data;
}

function formatPrice(pricePaise) {
    const value = Number(pricePaise);

    if (!Number.isFinite(value) || value <= 0) return null;

    return (value / 100).toFixed(2);
}

async function loadWallpapers() {
    cardsContainer.innerHTML = "<p>Loading wallpapers...</p>";

    try {
        const response = await fetch(`${API_BASE}/api/wallpapers`);
        const result = await readJson(response);
        const wallpapers = result.wallpapers || [];

        cardsContainer.innerHTML = "";

        if (!wallpapers.length) {
            cardsContainer.innerHTML = "<p>No published wallpapers yet.</p>";
            return;
        }

        wallpapers.forEach((wallpaper) => {
            const card = document.createElement("article");
            card.className = "card";
            card.dataset.title = wallpaper.title || "";

            const preview = document.createElement("div");
            preview.className = "preview";

            if (wallpaper.preview_url) {
                const img = document.createElement("img");
                img.src = wallpaper.preview_url;
                img.alt = `${wallpaper.title || "Wallpaper"} preview`;
                img.loading = "lazy";

                img.onerror = () => {
                    preview.textContent = "Preview unavailable";
                };

                preview.appendChild(img);
            } else {
                preview.textContent = wallpaper.category || "WALLPAPER";
            }

            const details = document.createElement("div");
            details.className = "details";

            const title = document.createElement("h3");
            title.textContent = wallpaper.title || "Untitled wallpaper";

            const description = document.createElement("p");
            description.textContent =
                wallpaper.description || "Premium PC wallpaper";

            const price = formatPrice(wallpaper.price_paise);

            const button = document.createElement("button");
            button.className = "buy";

            button.textContent = price !== null
                ? `Buy Wallpaper: ₹${price}`
                : "Price unavailable";

            button.dataset.wallpaperId = wallpaper.id || "";
            button.disabled = !wallpaper.id || price === null;

            button.addEventListener("click", demoBuy);

            details.append(title, description, button);
            card.append(preview, details);
            cardsContainer.appendChild(card);
        });

        applySearch();

    } catch (error) {
        console.error("Wallpaper loading error:", error);

        cardsContainer.innerHTML =
            "<p>Wallpapers could not load. Check that the backend is running.</p>";
    }
}

async function demoBuy(event) {
    const button = event.currentTarget;
    const wallpaperId = button.dataset.wallpaperId;

    if (!wallpaperId) {
        alert("Wallpaper ID is missing.");
        return;
    }

    if (typeof window.Razorpay !== "function") {
        alert("Razorpay Checkout did not load. Refresh the page.");
        return;
    }

    button.disabled = true;

    const originalText = button.textContent;
    button.textContent = "Creating test order...";

    try {
        const orderResponse = await fetch(`${API_BASE}/api/create-order`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({wallpaperId})
        });

        const order = await readJson(orderResponse);

        if (!order.id || !order.keyId || !order.amount) {
            throw new Error("Backend returned incomplete order details.");
        }

        const checkout = new window.Razorpay({
            key: order.keyId,
            amount: order.amount,
            currency: order.currency || "INR",
            name: "WallHaven",
            description: "Premium Wallpaper Purchase",
            order_id: order.id,

            handler: async function(paymentResponse) {
                button.textContent = "Verifying payment...";

                try {
                    const verifyResponse = await fetch(
                        `${API_BASE}/api/verify-payment`,
                        {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                razorpay_order_id: paymentResponse.razorpay_order_id,
                                razorpay_payment_id: paymentResponse.razorpay_payment_id,
                                razorpay_signature: paymentResponse.razorpay_signature
                            })
                        }
                    );

                    const verified = await readJson(verifyResponse);

                    console.log("VERIFY TOKEN CHECK:", {
                        verified: verified.verified,
                        tokenType: typeof verified.downloadToken,
                        tokenLength: verified.downloadToken?.length || 0
                    });

                    console.log("Payment verification result:", {
                        verified: verified.verified,
                        hasDownloadToken: typeof verified.downloadToken === "string",
                        tokenLength: verified.downloadToken?.length || 0
                    });

                    if (
                        verified.verified !== true ||
                        typeof verified.downloadToken !== "string" ||
                        !/^[a-f0-9]{64}$/.test(verified.downloadToken)
                    ) {
                        throw new Error("Payment verified, but download token is missing or invalid.");
                    }

                    button.textContent = "Preparing download...";

                    const downloadPayload = {
                        downloadToken: verified.downloadToken
                    };

                    console.log("TOKEN BEFORE DOWNLOAD:", {
                        tokenType: typeof downloadPayload.downloadToken,
                        tokenLength: downloadPayload.downloadToken.length
                    });

                    const downloadResponse = await fetch(
                        `${API_BASE}/api/download`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(downloadPayload)
                        }
                    );

                    const download = await readJson(downloadResponse);

                    if (!download.downloadUrl) {
                        throw new Error("Download link was not created.");
                    }

                    alert("Payment verified. Your download is starting.");

                    window.location.assign(download.downloadUrl);

                } catch (error) {
                    console.error("Payment/download error:", error);

                    alert(
                        "Payment or download error: " + error.message +
                        "\nIf payment was completed, do not pay again. Contact support."
                    );

                } finally {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            },

            modal: {
                ondismiss: function() {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            },

            theme: {color: "#9333ea"}
        });

        checkout.on("payment.failed", function(failure) {
            const error = failure.error || {};

            console.error("RAZORPAY FAILURE DETAILS:", {
                code: error.code,
                description: error.description,
                reason: error.reason,
                source: error.source,
                step: error.step
            });

            alert(
                "Payment failed!\n\n" +
                "Reason: " +
                (error.description || error.reason || "Unknown error") +
                "\n\nNo download was authorized."
            );

            button.disabled = false;
            button.textContent = originalText;
        });

        checkout.open();

    } catch (error) {
        console.error("Checkout error:", error);

        alert("Checkout error: " + error.message);

        button.disabled = false;
        button.textContent = originalText;
    }
}

function applySearch() {
    const term = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".card").forEach((card) => {
        card.style.display = (card.dataset.title || "")
            .toLowerCase()
            .includes(term) ? "" : "none";
    });
}

document.getElementById("search").addEventListener("input", applySearch);
loadWallpapers();
</script>
</body>
</html>
