<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at 50% 45%, rgba(119,36,210,.28), transparent 55%),
        linear-gradient(135deg,#08040f,#160626,#090410);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(180,100,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(180,100,255,.045) 1px,transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom,black,transparent);
}

body::after {
    content: "";
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(125,40,255,.12);
    filter: blur(100px);
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 950px;
    padding: 45px 22px;
    position: relative;
    z-index: 1;
}

.tagline {
    color: #d2a4ff;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 6px;
    font-size: 11px;
    margin-bottom: 28px;
    text-shadow: 0 0 15px #a34cff;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(32px,6vw,67px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 1px;
    background: linear-gradient(110deg,#ffffff 5%,#e4caff 35%,#b56cff 65%,#f2e5ff 90%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 17px rgba(169,91,255,.45));
}

.subtitle {
    color: #d0bedf;
    font-size: 19px;
    letter-spacing: 1.5px;
    margin: 25px auto 40px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.btn {
    position: relative;
    padding: 15px 38px;
    border-radius: 10px;
    border: 1px solid rgba(202,155,255,.65);
    color: #fff;
    background: rgba(143,70,220,.13);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .35s ease;
    box-shadow: inset 0 0 15px rgba(190,130,255,.08),0 0 15px rgba(153,75,255,.12);
}

.btn:hover {
    background: rgba(157,76,255,.3);
    border-color: #e0baff;
    box-shadow: 0 0 12px #9c4dff,0 0 30px rgba(156,77,255,.55);
    transform: translateY(-4px);
    color: white;
}

.btn:active {
    transform: scale(.97);
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

footer {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;
    color: #b7a2ca;
    font-size: 15px;
    letter-spacing: 2px;
    z-index: 2;
}

footer a {
    color: #d5a9ff;
    text-decoration: none;
    font-weight: 700;
    transition: .3s;
}

footer a:hover {
    color: white;
    text-shadow: 0 0 15px #b66aff;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3,0,10,.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
    overflow-y: auto;
}

.modal-box {
    width: 100%;
    max-width: 410px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 38px 30px;
    position: relative;
    background: rgba(35,16,57,.92);
    border: 1px solid rgba(195,139,255,.65);
    border-radius: 20px;
    backdrop-filter: blur(25px);
    box-shadow: 0 0 25px rgba(147,63,255,.3),inset 0 0 25px rgba(180,120,255,.08);
    animation: popup .35s ease;
}

@keyframes popup {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.94);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-box h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    color: #e2c4ff;
    margin: 10px 0 27px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #a64dff;
}

.modal-box input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    background: rgba(8,3,18,.85);
    color: white;
    border: 1px solid rgba(173,112,230,.45);
    border-radius: 9px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    outline: none;
    transition: .3s;
}

.modal-box input:focus {
    border-color: #c58aff;
    box-shadow: 0 0 15px rgba(165,83,255,.35);
}

.modal-box input::placeholder {
    color: #a995bb;
}

.modal-box .btn {
    width: 100%;
    margin-top: 18px;
}

[hidden] {
    display: none !important;
}

.close {
    position: absolute;
    top: 15px;
    right: 20px;
    cursor: pointer;
    color: #d5aaff;
    font-size: 27px;
    transition: .3s;
}

.close:hover {
    color: white;
    text-shadow: 0 0 15px #bd79ff;
}

#message {
    margin-top: 17px;
    color: #d9baff;
    font-size: 15px;
    letter-spacing: .5px;
    line-height: 1.5;
}

.success-icon {
    font-size: 48px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 15px #b46aff);
}

.success-title {

    font-size: 21px;
    line-height: 1.5;

.success-text {

}

@media(max-width:500px) {

    }

    .modal-box {

}

<body>

<div class="container">

    <div class="tagline">ENTER YOUR IMAGINATION</div>

    <h1>Welcome to a World<br>Beyond Imagination</h1>

    <p class="subtitle">
        Discover extraordinary wallpapers.<br>
        Give your screen a new identity.

    <div class="buttons">
        <button class="btn" onclick="openAuth('login')">LOGIN</button>
        <button class="btn" onclick="openAuth('signup')">SIGN UP</button>

</div>

<footer>
    FOLLOW US &nbsp;·&nbsp;
    <a href="https://www.instagram.com/rohxthx.__/"
       target="_blank" rel="noopener noreferrer">
       @rohxthx.__
    </a>
</footer>

<!-- AUTHENTICATION MODAL -->

<div class="modal" id="authModal">

    <div class="modal-box">

        <span class="close" onclick="closeAuth()">×</span>

        <h2 id="authTitle">LOGIN</h2>

        <form id="authForm">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                autocomplete="name"
                hidden
            >

            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="6"
                autocomplete="current-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                minlength="6"
                autocomplete="new-password"
                hidden
            >

            <button type="submit" class="btn" id="authSubmit">
                LOGIN
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

    </div>

</div>

<!-- SUCCESS POPUP -->

<div class="modal" id="successModal">

    <div class="modal-box">

        <div class="success-icon">✦</div>

        <h2 class="success-title" id="successTitle">
            WELCOME TO WALLHAVEN
        </h2>

        <p class="success-text" id="successText">
            Your journey into a world of extraordinary wallpapers starts here.
        </p>

        <a href="explore.html" class="btn explore-btn">
            EXPLORE WALLPAPERS →
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://vxtryneiljxvrnakubdd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_p1qEiO-agXUY6iyxH8OJnQ_rU0gg7Yp";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let authMode = "login";

function openAuth(mode) {

    authMode = mode;

    const form = document.getElementById("authForm");

    form.reset();

    document.getElementById("authTitle").textContent =
        mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

    document.getElementById("authSubmit").textContent =
        mode === "login" ? "LOGIN" : "SIGN UP";

    document.getElementById("fullName").hidden =
        mode === "login";

    document.getElementById("confirmPassword").hidden =
        mode === "login";

    document.getElementById("fullName").required =
        mode === "signup";

    document.getElementById("confirmPassword").required =
        mode === "signup";

    document.getElementById("password").placeholder =
        mode === "login" ? "Password" : "Create Password";

    document.getElementById("password").autocomplete =
        mode === "login" ? "current-password" : "new-password";

    document.getElementById("message").textContent = "";

    document.getElementById("authModal").style.display = "flex";

}

function closeAuth() {

    document.getElementById("authModal").style.display = "none";

}

function showSuccess(mode) {

    document.getElementById("authModal").style.display = "none";

    document.getElementById("successTitle").textContent =
        mode === "signup"
        ? "ACCOUNT CREATED!"
        : "WELCOME BACK!";

    document.getElementById("successText").textContent =
        mode === "signup"
        ? "Your WallHaven account is ready. Enjoy exploring!"
        : "Login successful! Welcome back to WallHaven.";

    document.getElementById("successModal").style.display = "flex";

}

// SIGNUP AND LOGIN

document.getElementById("authForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const submitButton =
            document.getElementById("authSubmit");

        if (authMode === "signup") {

            if (!fullName) {
                message.textContent = "Please enter your full name.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                return;
            }

        }

        message.textContent = "Please wait...";

        submitButton.disabled = true;
        submitButton.textContent = "PLEASE WAIT...";

        try {

            let result;

            if (authMode === "signup") {

                result = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: fullName
                        }

                    }

                });

            } else {

                result = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });

            }

            if (result.error) {

                message.textContent = result.error.message;
                return;

            }

            if (!result.data.session) {

                message.textContent =
                    "Account created, but email confirmation is still enabled in Supabase. Please contact the site administrator.";

                return;

            }

            showSuccess(authMode);

        }

        catch (error) {

            message.textContent =
                error.message || "Something went wrong. Please try again.";

        }

        finally {

            submitButton.disabled = false;

            submitButton.textContent =
                authMode === "login" ? "LOGIN" : "SIGN UP";

        }

    }
);

// CLOSE MODALS

document.getElementById("authModal").addEventListener(
    "click",
    function(e) {

        if (e.target === this) {
            closeAuth();
        }

    }
);

document.getElementById("successModal").addEventListener(
    "click",
    function(e) {

        if (e.target === this) {
            this.style.display = "none";
        }

    }
);

</script>

</body>
